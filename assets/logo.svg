<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D8FF"/>
      <stop offset="45%" stop-color="#007BFF"/>
      <stop offset="100%" stop-color="#001D47"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00173e"/>
      <stop offset="100%" stop-color="#002b66"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Speed Lines Left -->
    <rect x="90" y="112" width="40" height="11" rx="5.5" fill="#007BFF" />
    <rect x="100" y="132" width="30" height="11" rx="5.5" fill="#007BFF" />
    <rect x="115" y="152" width="15" height="11" rx="5.5" fill="#007BFF" />

    <!-- Cloud Outline -->
    <path d="M 148 112 
             C 148 78, 178 52, 212 52 
             C 224 52, 236 56, 246 62 
             C 258 40, 282 26, 310 26 
             C 350 26, 384 58, 384 98 
             C 384 100, 384 102, 383 105 
             C 406 112, 422 133, 422 158 
             C 422 188, 398 212, 368 212 
             L 364 212" 
          stroke="url(#cloudGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Left Cloud Arc -->
    <path d="M 148 112 C 148 140, 166 164, 192 172" 
          stroke="url(#cloudGrad)" stroke-width="20" stroke-linecap="round" />

    <!-- Server Racks (3 Blades) -->
    <g transform="translate(165, 88)">
      <rect width="138" height="26" rx="13" fill="url(#serverGrad)"/>
      <circle cx="120" cy="13" r="3.5" fill="#00D8FF"/>
    </g>

    <g transform="translate(165, 122)">
      <rect width="138" height="26" rx="13" fill="url(#serverGrad)"/>
      <circle cx="120" cy="13" r="3.5" fill="#00D8FF"/>
    </g>

    <g transform="translate(165, 156)">
      <rect width="138" height="26" rx="13" fill="url(#serverGrad)"/>
      <circle cx="120" cy="13" r="3.5" fill="#00D8FF"/>
    </g>
  </g>

  <!-- Typography EGYHOST -->
  <text x="240" y="275" text-anchor="middle" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-weight="800" font-size="64" letter-spacing="1">
    <tspan fill="#007BFF">EGY</tspan><tspan fill="#001D47">HOST</tspan>
  </text>
</svg>
